# Smithery configuration for JevGuard MCP
build:
  command: "pip install ."
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      typesafeApiKey:
        type: string
        description: "TypeSafe AI API key for upstream evaluation"
  commandFunction:
    |
    (config) => ({
      command: "python3",
      args: ["-m", "jevguard_mcp.server"],
      env: config.typesafeApiKey ? { TYPESAFE_API_KEY: config.typesafeApiKey } : {}
    })
